<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; padding: 0;
    width: 1080px; height: 1350px;
  }
  body {
    /* 한국어/일본어 카드뉴스 공용 폰트 스택 (로컬에 설치된 폰트를 우선 사용) */
    font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR",
      "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
    background: #faf6f0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 80px;
    box-sizing: border-box;
  }
  .badge {
    font-size: 28px;
    color: #a67c52;
    letter-spacing: 4px;
    margin-bottom: 40px;
  }
  h1 {
    font-size: 64px;
    line-height: 1.4;
    color: #2b2b2b;
    margin: 0 0 40px 0;
    white-space: pre-line;
  }
  p {
    font-size: 36px;
    line-height: 1.7;
    color: #4a4a4a;
    white-space: pre-line;
  }
  .page-index {
    position: absolute;
    bottom: 60px;
    right: 60px;
    font-size: 28px;
    color: #a67c52;
  }
</style>
</head>
<body>
  <div class="badge">{{BADGE}}</div>
  <h1>{{TITLE}}</h1>
  <p>{{BODY}}</p>
  <div class="page-index">{{PAGE}} / {{TOTAL}}</div>
</body>
</html>
